<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>High-Level Relationship Chart | Pentateuch, Mishnah, Mishneh Torah, Shulchan Aruch</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --ink: #1f2937;
      --muted: #6b7280;
      --card: #ffffff;
      --line: #d5deea;
      --l1: #4b8f3a;
      --l2: #f08a24;
      --l3: #2d78b8;
      --l4: #8b5fbf;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Noto Sans", Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
    }
    .wrap {
      max-width: 1800px;
      margin: 0 auto;
      padding: 16px 16px 24px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.4rem;
      font-weight: 700;
    }
    .subtitle {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.96rem;
    }
    .legend {
      display: grid;
      grid-template-columns: repeat(4, minmax(180px, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }
    .legend-item {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 0.9rem;
    }
    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
    #chart {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: auto;
    }
    svg {
      display: block;
      min-width: 1500px;
    }
    .node rect {
      stroke: #fff;
      stroke-width: 1px;
    }
    .node text {
      font-size: 12px;
      fill: #1f2937;
      pointer-events: none;
    }
    .link {
      fill: none;
      stroke-opacity: 0.25;
      mix-blend-mode: multiply;
    }
    .link:hover {
      stroke-opacity: 0.65;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>High-Level Relationship Chart</h1>
    <p class="subtitle">Based on current mappings: Pentateuch → Mishnah → Mishneh Torah → Shulchan Aruch (high-level, aggregated).</p>
    <div class="legend">
      <div class="legend-item"><span class="dot" style="background: var(--l1);"></span>Pentateuch (Books)</div>
      <div class="legend-item"><span class="dot" style="background: var(--l2);"></span>Mishnah (Sedarim)</div>
      <div class="legend-item"><span class="dot" style="background: var(--l3);"></span>Mishneh Torah (Sefarim)</div>
      <div class="legend-item"><span class="dot" style="background: var(--l4);"></span>Shulchan Aruch (4 Sections)</div>
    </div>
    <div id="chart"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
  <script>
    const graph = {"nodes": [{"id": "L1:Exodus", "name": "Exodus", "layer": 1, "value": 5.333333333333333}, {"id": "L1:Leviticus", "name": "Leviticus", "layer": 1, "value": 9.5}, {"id": "L1:Numbers", "name": "Numbers", "layer": 1, "value": 9.666666666666666}, {"id": "L1:Deuteronomy", "name": "Deuteronomy", "layer": 1, "value": 11.5}, {"id": "L1:Genesis", "name": "Genesis", "layer": 1, "value": 0}, {"id": "L2:Zeraim", "name": "Zeraim", "layer": 2, "value": 30.0}, {"id": "L2:Moed", "name": "Moed", "layer": 2, "value": 19.0}, {"id": "L2:Nashim", "name": "Nashim", "layer": 2, "value": 20.0}, {"id": "L2:Nezikin", "name": "Nezikin", "layer": 2, "value": 11.0}, {"id": "L2:Kodashim", "name": "Kodashim", "layer": 2, "value": 14.0}, {"id": "L2:Tahorot", "name": "Tahorot", "layer": 2, "value": 4.0}, {"id": "L3:Madda", "name": "Madda", "layer": 3, "value": 0}, {"id": "L3:Ahavah", "name": "Ahavah", "layer": 3, "value": 2.0}, {"id": "L3:Zemanim", "name": "Zemanim", "layer": 3, "value": 20.0}, {"id": "L3:Nashim", "name": "Nashim", "layer": 3, "value": 20.0}, {"id": "L3:Kedushah", "name": "Kedushah", "layer": 3, "value": 8.0}, {"id": "L3:Haflaah", "name": "Haflaah", "layer": 3, "value": 4.0}, {"id": "L3:Zeraim", "name": "Zeraim", "layer": 3, "value": 30.0}, {"id": "L3:Avodah", "name": "Avodah", "layer": 3, "value": 3.0}, {"id": "L3:Korbanot", "name": "Korbanot", "layer": 3, "value": 5.0}, {"id": "L3:Taharah", "name": "Taharah", "layer": 3, "value": 2.0}, {"id": "L3:Nezikin", "name": "Nezikin", "layer": 3, "value": 11.0}, {"id": "L3:Kinyan", "name": "Kinyan", "layer": 3, "value": 3.0}, {"id": "L3:Mishpatim", "name": "Mishpatim", "layer": 3, "value": 1.0}, {"id": "L3:Shoftim", "name": "Shoftim", "layer": 3, "value": 1.0}, {"id": "L4:Orach Chayim", "name": "Orach Chayim", "layer": 4, "value": 11.0}, {"id": "L4:Yoreh Deah", "name": "Yoreh Deah", "layer": 4, "value": 13.5}, {"id": "L4:Even HaEzer", "name": "Even HaEzer", "layer": 4, "value": 3.0}, {"id": "L4:Choshen Mishpat", "name": "Choshen Mishpat", "layer": 4, "value": 3.5}, {"id": "L4:No Practical Parallel", "name": "No Practical Parallel", "layer": 4, "value": 6.0}], "links": [{"source": 3, "target": 5, "value": 3.3333, "layer": 1}, {"source": 2, "target": 5, "value": 1.8333, "layer": 1}, {"source": 0, "target": 5, "value": 0.3333, "layer": 1}, {"source": 3, "target": 6, "value": 2.0, "layer": 1}, {"source": 0, "target": 6, "value": 1.8333, "layer": 1}, {"source": 2, "target": 6, "value": 3.0, "layer": 1}, {"source": 1, "target": 6, "value": 2.1667, "layer": 1}, {"source": 3, "target": 9, "value": 1.8333, "layer": 1}, {"source": 1, "target": 9, "value": 3.0, "layer": 1}, {"source": 2, "target": 9, "value": 0.8333, "layer": 1}, {"source": 0, "target": 9, "value": 1.3333, "layer": 1}, {"source": 1, "target": 5, "value": 2.5, "layer": 1}, {"source": 3, "target": 7, "value": 2.5, "layer": 1}, {"source": 0, "target": 7, "value": 0.5, "layer": 1}, {"source": 2, "target": 7, "value": 3.0, "layer": 1}, {"source": 1, "target": 10, "value": 1.5, "layer": 1}, {"source": 0, "target": 8, "value": 1.3333, "layer": 1}, {"source": 3, "target": 8, "value": 1.8333, "layer": 1}, {"source": 1, "target": 8, "value": 0.3333, "layer": 1}, {"source": 2, "target": 8, "value": 0.5, "layer": 1}, {"source": 2, "target": 10, "value": 0.5, "layer": 1}, {"source": 5, "target": 12, "value": 1.0, "layer": 2}, {"source": 6, "target": 13, "value": 10.0, "layer": 2}, {"source": 9, "target": 15, "value": 3.0, "layer": 2}, {"source": 9, "target": 19, "value": 2.5, "layer": 2}, {"source": 5, "target": 17, "value": 7.0, "layer": 2}, {"source": 7, "target": 14, "value": 4.0, "layer": 2}, {"source": 7, "target": 16, "value": 2.0, "layer": 2}, {"source": 10, "target": 15, "value": 1.0, "layer": 2}, {"source": 8, "target": 21, "value": 1.5, "layer": 2}, {"source": 8, "target": 22, "value": 1.5, "layer": 2}, {"source": 8, "target": 23, "value": 0.5, "layer": 2}, {"source": 8, "target": 24, "value": 0.5, "layer": 2}, {"source": 9, "target": 18, "value": 1.5, "layer": 2}, {"source": 10, "target": 20, "value": 1.0, "layer": 2}, {"source": 12, "target": 25, "value": 1.0, "layer": 3}, {"source": 13, "target": 25, "value": 10.0, "layer": 3}, {"source": 15, "target": 26, "value": 4.0, "layer": 3}, {"source": 19, "target": 26, "value": 1.0, "layer": 3}, {"source": 17, "target": 26, "value": 7.0, "layer": 3}, {"source": 14, "target": 27, "value": 3.0, "layer": 3}, {"source": 16, "target": 26, "value": 1.0, "layer": 3}, {"source": 16, "target": 29, "value": 1.0, "layer": 3}, {"source": 14, "target": 29, "value": 1.0, "layer": 3}, {"source": 21, "target": 28, "value": 1.5, "layer": 3}, {"source": 22, "target": 28, "value": 1.25, "layer": 3}, {"source": 22, "target": 26, "value": 0.25, "layer": 3}, {"source": 23, "target": 28, "value": 0.25, "layer": 3}, {"source": 23, "target": 26, "value": 0.25, "layer": 3}, {"source": 24, "target": 28, "value": 0.5, "layer": 3}, {"source": 19, "target": 29, "value": 1.5, "layer": 3}, {"source": 18, "target": 29, "value": 1.5, "layer": 3}, {"source": 20, "target": 29, "value": 1.0, "layer": 3}]};

    const width = 1700;
    const height = 980;

    const colorByLayer = new Map([
      [1, getComputedStyle(document.documentElement).getPropertyValue('--l1').trim()],
      [2, getComputedStyle(document.documentElement).getPropertyValue('--l2').trim()],
      [3, getComputedStyle(document.documentElement).getPropertyValue('--l3').trim()],
      [4, getComputedStyle(document.documentElement).getPropertyValue('--l4').trim()],
    ]);

    const nodeColor = d => colorByLayer.get(d.layer) || "#888";
    const linkColor = d => colorByLayer.get(d.layer) || "#999";

    const svg = d3.select("#chart")
      .append("svg")
      .attr("viewBox", [0, 0, width, height])
      .attr("width", "100%")
      .attr("height", height);

    const sankey = d3.sankey()
      .nodeWidth(12)
      .nodePadding(8)
      .extent([[18, 40], [width - 18, height - 30]])
      .nodeAlign(d3.sankeyJustify)
      // Preserve the explicit node order provided by the Python layer lists.
      .nodeSort(null);

    const g = sankey({
      nodes: graph.nodes.map(d => Object.assign({}, d)),
      links: graph.links.map(d => Object.assign({}, d))
    });

    svg.append("g")
      .selectAll("path")
      .data(g.links)
      .join("path")
      .attr("class", "link")
      .attr("d", d3.sankeyLinkHorizontal())
      .attr("stroke", d => linkColor(d))
      .attr("stroke-width", d => Math.max(1, d.width))
      .append("title")
      .text(d => `${d.source.name} -> ${d.target.name}\nWeight: ${d.value.toFixed(2)}`);

    const node = svg.append("g")
      .selectAll("g")
      .data(g.nodes)
      .join("g")
      .attr("class", "node");

    node.append("rect")
      .attr("x", d => d.x0)
      .attr("y", d => d.y0)
      .attr("height", d => Math.max(2, d.y1 - d.y0))
      .attr("width", d => d.x1 - d.x0)
      .attr("fill", d => nodeColor(d))
      .append("title")
      .text(d => `${d.name}\nTotal flow: ${(d.value || 0).toFixed(2)}`);

    node.append("text")
      .attr("x", d => d.x0 < width / 2 ? d.x1 + 6 : d.x0 - 6)
      .attr("y", d => (d.y1 + d.y0) / 2)
      .attr("dy", "0.35em")
      .attr("text-anchor", d => d.x0 < width / 2 ? "start" : "end")
      .text(d => d.name);
  </script>
</body>
</html>
