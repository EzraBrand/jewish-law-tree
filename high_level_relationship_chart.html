l): Mishneh Torah: Sefer Avodah; Sefer Korbanot | Shulchan Aruch: (no full practical code parallel)\\n- Temple Daily Service/Structure: Mishneh Torah: Sefer Avodah: Hilkhot Temidin uMusafin; Beit haBechirah | Shulchan Aruch: (no full practical code parallel)"}, {"source": 20, "target": 29, "value": 1.0, "layer": 3, "tooltip": "Taharah -> No Practical Parallel\\nWeight: 1.00\\n\\nContributing entries (sample):\\n- Purity/Impurity Systems: Mishneh Torah: Sefer Taharah | Shulchan Aruch: (no full practical code parallel)"}]};

    const width = 1700;
    const height = 980;

    const colorByLayer = new Map([
      [1, getComputedStyle(document.documentElement).getPropertyValue('--l1').trim()],
      [2, getComputedStyle(document.documentElement).getPropertyValue('--l2').trim()],
      [3, getComputedStyle(document.documentElement).getPropertyValue('--l3').trim()],
      [4, getComputedStyle(document.documentElement).getPropertyValue('--l4').trim()],
    ]);

    const nodeColor = d => colorByLayer.get(d.layer) || "#888";
    const linkColor = d => colorByLayer.get(d.layer) || "#999";

    const svg = d3.select("#chart")
      .append("svg")
      .attr("viewBox", [0, 0, width, height])
      .attr("width", "100%")
      .attr("height", height);

    const sankey = d3.sankey()
      .nodeWidth(12)
      .nodePadding(8)
      .extent([[18, 40], [width - 18, height - 30]])
      .nodeAlign(d3.sankeyJustify)
      // Preserve the explicit node order provided by the Python layer lists.
      .nodeSort(null);

    const g = sankey({
      nodes: graph.nodes.map(d => Object.assign({}, d)),
      links: graph.links.map(d => Object.assign({}, d))
    });

    svg.append("g")
      .selectAll("path")
      .data(g.links)
      .join("path")
      .attr("class", "link")
      .attr("d", d3.sankeyLinkHorizontal())
      .attr("stroke", d => linkColor(d))
      .attr("stroke-width", d => Math.max(1, d.width))
      .append("title")
      .text(d => d.tooltip || `${d.source.name} -> ${d.target.name}\nWeight: ${d.value.toFixed(2)}`);

    const node = svg.append("g")
      .selectAll("g")
      .data(g.nodes)
      .join("g")
      .attr("class", "node");

    node.append("rect")
      .attr("x", d => d.x0)
      .attr("y", d => d.y0)
      .attr("height", d => Math.max(2, d.y1 - d.y0))
      .attr("width", d => d.x1 - d.x0)
      .attr("fill", d => nodeColor(d))
      .append("title")
      .text(d => `${d.name}\nTotal flow: ${(d.value || 0).toFixed(2)}`);

    node.append("text")
      .attr("x", d => d.x0 < width / 2 ? d.x1 + 6 : d.x0 - 6)
      .attr("y", d => (d.y1 + d.y0) / 2)
      .attr("dy", "0.35em")
      .attr("text-anchor", d => d.x0 < width / 2 ? "start" : "end")
      .text(d => d.name);
