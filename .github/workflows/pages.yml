name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp comparative_topic_tree_hyperlinked.html _site/comparative_topic_tree_hyperlinked.html
          cp comparative_topic_matrix.csv _site/comparative_topic_matrix.csv
          cp comparative_topic_matrix_with_subtopic.csv _site/comparative_topic_matrix_with_subtopic.csv
          cp comparative_topic_tree_vertical.png _site/comparative_topic_tree_vertical.png
          cp comparative_topic_tree_vertical.svg _site/comparative_topic_tree_vertical.svg
          cp robots.txt _site/robots.txt
          cp sitemap.xml _site/sitemap.xml

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
