name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build static site artifact
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp comparative_topic_tree_hyperlinked.html _site/comparative_topic_tree_hyperlinked.html
          cp comparative_topic_matrix.csv _site/comparative_topic_matrix.csv
          cp comparative_topic_matrix_with_subtopic.csv _site/comparative_topic_matrix_with_subtopic.csv
          cp comparative_topic_tree_vertical.png _site/comparative_topic_tree_vertical.png
          cp comparative_topic_tree_vertical.svg _site/comparative_topic_tree_vertical.svg

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
